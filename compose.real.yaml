name: zhijing-real-api

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: zhijing_real
      POSTGRES_USER: zhijing_real
      POSTGRES_PASSWORD: zhijing-real-local-only
    ports:
      - "127.0.0.1:${ZHIJING_REAL_DATABASE_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhijing_real -d zhijing_real"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - zhijing-real-postgres:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    image: zhijing-real-api:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://zhijing_real:zhijing-real-local-only@postgres:5432/zhijing_real
    command: ["pnpm", "db:migrate"]
    restart: "no"

  web:
    image: zhijing-real-api:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://zhijing_real:zhijing-real-local-only@postgres:5432/zhijing_real
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      BETTER_AUTH_TRUSTED_PROXIES: ${BETTER_AUTH_TRUSTED_PROXIES:-127.0.0.1/32}
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:?AUTH_EMAIL_FROM is required}
      GENERATION_RATE_LIMIT_WINDOW_SECONDS: ${GENERATION_RATE_LIMIT_WINDOW_SECONDS:-3600}
      GENERATION_RATE_LIMIT_MAX_REQUESTS: ${GENERATION_RATE_LIMIT_MAX_REQUESTS:-5}
    ports:
      - "127.0.0.1:${ZHIJING_REAL_WEB_PORT:-3001}:3000"
    command: ["pnpm", "start"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  generation-worker:
    image: zhijing-real-api:local
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://zhijing_real:zhijing-real-local-only@postgres:5432/zhijing_real
      GENERATION_WORKER_ID: ${GENERATION_WORKER_ID:-generation-worker-real-local-1}
      ZHIHU_ACCESS_SECRET: ${ZHIHU_ACCESS_SECRET:?ZHIHU_ACCESS_SECRET is required}
      ZHIHU_MODEL: ${ZHIHU_MODEL:-zhida-thinking-1p5}
      ZHIHU_SOURCE_TIMEOUT_MS: ${ZHIHU_SOURCE_TIMEOUT_MS:-30000}
      ZHIHU_MODEL_TIMEOUT_MS: ${ZHIHU_MODEL_TIMEOUT_MS:-60000}
      REAL_API_VERIFY_TOPIC: ${REAL_API_VERIFY_TOPIC:-TypeScript 泛型约束}
    command: ["pnpm", "worker:generation"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

volumes:
  zhijing-real-postgres:
    name: zhijing-real-api-postgres
