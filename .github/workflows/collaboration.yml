name: 协作规范检查

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collaboration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 验证协作基线
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出完整提交历史
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 验证普通 PR 的目标分支
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${BASE_BRANCH}" == "main" ]] && {
            [[ "${HEAD_BRANCH}" != "dev" ]] || [[ "${HEAD_REPOSITORY}" != "${REPOSITORY}" ]]
          }; then
            echo "普通 PR 不得直接进入 main；请先提交到 dev。" >&2
            exit 1
          fi

      - name: 验证拉取请求
        if: github.event_name == 'pull_request'
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: scripts/verify-collaboration.sh --base "${BASE_COMMIT}" --head "${HEAD_COMMIT}"

      - name: 审计主分支新增提交
        if: github.event_name == 'push'
        env:
          BASE_COMMIT: ${{ github.event.before }}
          HEAD_COMMIT: ${{ github.event.after }}
        run: scripts/verify-collaboration.sh --base "${BASE_COMMIT}" --head "${HEAD_COMMIT}"

      - name: 手动验证当前协作基线
        if: github.event_name == 'workflow_dispatch'
        run: scripts/verify-collaboration.sh
