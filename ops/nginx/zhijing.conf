# Install on the VPS as /etc/nginx/sites-enabled/zhijing.conf after replacing
# the server_name and certificate paths with the real deployment values.
upstream zhijing_web {
    # compose.production.yaml pins WEB_BIND_PORT=3000 in production_preflight.
    # Keep this loopback upstream in lockstep with that single source of truth.
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # The deploy host provisions these files with certbot/acme. Do not commit
    # certificates or private keys to this repository.
    ssl_certificate /etc/letsencrypt/live/zhijing/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhijing/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Only the loopback-published Web port is reachable from Nginx. PostgreSQL
    # has no host-published port in compose.production.yaml.
    location ^~ /api/map-generations/ {
        proxy_pass http://zhijing_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Last-Event-ID $http_last_event_id;

        # SSE must be delivered event-by-event. Never buffer, cache, compress,
        # or impose a short upstream timeout on this location.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_connect_timeout 10s;
        gzip off;
        add_header X-Accel-Buffering no always;
    }

    location / {
        proxy_pass http://zhijing_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
