openapi: 3.1.0
info:
  title: Zhijing API
  version: 0.1.0
  description: >-
    Contract-first business API. Better Auth managed authentication endpoints are
    versioned separately and are not duplicated here.
tags:
  - name: Featured learning maps
    description: Authenticated read access to current published featured map versions.
  - name: Learning relationships
    description: Account-owned access to an immutable learning-map version.
  - name: Map generations
    description: Authenticated, account-scoped custom map generation and resumable progress.
paths:
  /api/featured-learning-maps:
    get:
      operationId: listFeaturedLearningMaps
      tags:
        - Featured learning maps
      summary: 读取精选学习地图目录
      description: >-
        Returns every currently featured map in editorial position order. An empty
        items array is a successful empty catalog and never triggers live generation.
      security:
        - betterAuthSession: []
      responses:
        "200":
          description: 当前已发布精选地图目录
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedLearningMapList"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/featured-learning-maps/{mapId}:
    get:
      operationId: getFeaturedLearningMap
      tags:
        - Featured learning maps
      summary: 读取当前精选学习地图详情
      description: >-
        Resolves a stable mapId through the featured pointer and returns its current
        immutable published version. Draft, non-featured and missing maps are all
        reported as resource_not_found.
      security:
        - betterAuthSession: []
      parameters:
        - $ref: "#/components/parameters/MapId"
      responses:
        "200":
          description: 当前精选版本的完整图与来源证据投影
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningMapDetail"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/learning-relationships/{learningRelationshipId}/map:
    get:
      operationId: getLearningRelationshipMap
      tags:
        - Learning relationships
      summary: 读取当前账户学习关系绑定的地图
      description: >-
        Returns the immutable published map version bound to this account-owned
        learning relationship. The relationship is established by a successful
        generation or cache hit; this endpoint never joins a map by ID.
      security:
        - betterAuthSession: []
      parameters:
        - $ref: "#/components/parameters/LearningRelationshipId"
      responses:
        "200":
          description: 学习关系绑定的完整地图与来源证据投影
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningMapDetail"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/learning-relationships/{learningRelationshipId}/nodes/{nodeId}/assessment:
    get:
      operationId: getLearningNodeAssessment
      tags:
        - Learning relationships
      summary: 获取节点验证题面
      description: >-
        Returns the questions bound to the immutable question-set version of this
        learning relationship. The response never contains explanations, standard
        answers or other server-only judging data.
      security:
        - betterAuthSession: []
      parameters:
        - $ref: "#/components/parameters/LearningRelationshipId"
        - $ref: "#/components/parameters/NodeId"
      responses:
        "200":
          description: 不含答案的节点验证题面
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningNodeAssessment"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: submitLearningNodeAssessment
      tags:
        - Learning relationships
      summary: 提交节点验证答案
      description: >-
        Judges answers on the server, records one immutable attempt and updates the
        relationship-scoped best score in one transaction. Reusing an
        Idempotency-Key returns the original result without creating another attempt.
      security:
        - betterAuthSession: []
      parameters:
        - $ref: "#/components/parameters/LearningRelationshipId"
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentSubmission"
      responses:
        "200":
          description: 服务端判题结果、节点分数和完成状态
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentSubmissionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/learning-relationships/{learningRelationshipId}/progress:
    get:
      operationId: getLearningRelationshipProgress
      tags:
        - Learning relationships
      summary: 读取学习关系进度和答题历史摘要
      description: >-
        Returns progress for every node in the relationship's pinned map version and
        immutable attempt summaries ordered from newest to oldest.
      security:
        - betterAuthSession: []
      parameters:
        - $ref: "#/components/parameters/LearningRelationshipId"
      responses:
        "200":
          description: 节点最佳成绩、完成状态与历史摘要
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningProgressSummary"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/map-generations:
    post:
      operationId: requestMapGeneration
      tags:
        - Map generations
      summary: 请求生成一张自定义学习地图
      description: >-
        Creates or joins the account's generation task for a normalized topic. A
        cache hit is still account-scoped: the response identifies the caller's
        newly established learning relationship. The Web process only enqueues or
        reads persisted state; provider credentials are required by the Worker.
      security:
        - betterAuthSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapGenerationRequest"
      responses:
        "202":
          description: 已创建、加入活动任务或命中缓存的生成任务快照
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapGenerationRequestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/map-generations/{taskId}:
    get:
      operationId: getMapGeneration
      tags:
        - Map generations
      summary: 读取账户参与的生成任务快照
      description: >-
        Returns only the persisted safe state of a task in which the current
        account participates. A guessed task ID and a task owned by another
        account both return resource_not_found.
      security:
        - betterAuthSession: []
      parameters:
        - $ref: "#/components/parameters/GenerationTaskId"
      responses:
        "200":
          description: 生成状态、阶段、恢复序号和终态结果或失败类别
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerationTaskSnapshot"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/map-generations/{taskId}/events:
    get:
      operationId: streamMapGenerationEvents
      tags:
        - Map generations
      summary: 以 SSE 订阅可恢复的生成进度
      description: >-
        Revalidates the formal Session and task participation on every connection.
        Last-Event-ID is a persisted sequence cursor. If retained history cannot
        satisfy the cursor, the first event is a complete snapshot event followed
        by retained events. Only safe status, stage, result identifiers and stable
        failure categories are emitted; candidate content and provider details are
        never sent. A succeeded or failed terminal event closes the stream.
      security:
        - betterAuthSession: []
      parameters:
        - $ref: "#/components/parameters/GenerationTaskId"
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: 事件流；每个持久事件都使用单调序号和封闭事件类型
          headers:
            Cache-Control:
              $ref: "#/components/headers/SseCacheControl"
            X-Accel-Buffering:
              $ref: "#/components/headers/SseNoBuffer"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/GenerationSseStream"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/ResourceNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    betterAuthSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: >-
        Better Auth database-backed session cookie. Production uses the framework's
        __Secure- prefix. The server also requires the session account to have a
        verified email before it becomes a formal product identity.
  parameters:
    MapId:
      name: mapId
      in: path
      required: true
      description: Stable learning-map identity; this is not a version ID.
      schema:
        type: string
        minLength: 1
    LearningRelationshipId:
      name: learningRelationshipId
      in: path
      required: true
      description: Account-owned relationship that pins one immutable map version.
      schema:
        type: string
        minLength: 1
    NodeId:
      name: nodeId
      in: path
      required: true
      description: Node in the relationship's pinned map version.
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Repeated submissions with the same relationship-scoped key return the same result.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    GenerationTaskId:
      name: taskId
      in: path
      required: true
      description: Stable opaque generation task identifier.
      schema:
        type: string
        minLength: 1
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Last persisted event sequence received by the client.
      schema:
        type: integer
        minimum: 0
  headers:
    PrivateNoStore:
      description: Protected content must not enter shared or cross-account caches.
      schema:
        type: string
        const: private, no-store
    SseNoBuffer:
      description: Streaming responses must not be buffered by a reverse proxy.
      schema:
        type: string
        const: "no"
    SseCacheControl:
      description: SSE responses are private and must not be buffered or transformed.
      schema:
        type: string
        const: private, no-cache, no-transform
  schemas:
    FeaturedLearningMapList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeaturedLearningMapSummary"
    FeaturedLearningMapSummary:
      type: object
      additionalProperties: false
      required:
        - mapId
        - versionId
        - title
        - summary
        - nodeCount
      properties:
        mapId:
          type: string
          minLength: 1
          description: Stable identity shared by all versions of the topic.
        versionId:
          type: string
          minLength: 1
          description: Immutable version currently selected by the featured pointer.
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        nodeCount:
          type: integer
          minimum: 5
          maximum: 7
    LearningMapDetail:
      type: object
      additionalProperties: false
      required:
        - mapId
        - versionId
        - title
        - summary
        - nodes
        - prerequisites
        - sources
        - viewpoints
      properties:
        mapId:
          type: string
          minLength: 1
          description: Stable identity shared by all versions of the topic.
        versionId:
          type: string
          minLength: 1
          description: Immutable content version returned by this response.
        title:
          type: string
          minLength: 1
        summary:
          type: string
          minLength: 1
        nodes:
          type: array
          minItems: 5
          maxItems: 7
          items:
            $ref: "#/components/schemas/LearningMapNode"
        prerequisites:
          type: array
          items:
            $ref: "#/components/schemas/LearningMapPrerequisite"
        sources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/KnowledgeSource"
        viewpoints:
          type: array
          items:
            $ref: "#/components/schemas/SourcedViewpoint"
    LearningMapNode:
      type: object
      additionalProperties: false
      required:
        - nodeId
        - title
        - learningObjective
        - sourceIds
      properties:
        nodeId:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        learningObjective:
          type: string
          minLength: 1
        sourceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
    LearningMapPrerequisite:
      type: object
      additionalProperties: false
      required:
        - nodeId
        - prerequisiteNodeId
      properties:
        nodeId:
          type: string
          minLength: 1
          description: Node that requires the prerequisite.
        prerequisiteNodeId:
          type: string
          minLength: 1
          description: Node that must be learned first.
    KnowledgeSource:
      type: object
      additionalProperties: false
      required:
        - sourceId
        - title
        - excerpt
        - url
        - authorName
      properties:
        sourceId:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        excerpt:
          type: string
          minLength: 1
        url:
          type: string
          format: uri
          pattern: '^https://(?:[A-Za-z0-9-]+\.)*zhihu\.com(?:[/?#].*)?$'
          description: HTTPS Zhihu URL accepted from the server-side source adapter boundary.
        authorName:
          type: string
          minLength: 1
    SourcedViewpoint:
      type: object
      additionalProperties: false
      required:
        - viewpointId
        - nodeId
        - kind
        - statement
        - conditions
        - sourceIds
      properties:
        viewpointId:
          type: string
          minLength: 1
        nodeId:
          type: string
          minLength: 1
        kind:
          type: string
          enum:
            - consensus
            - disagreement
            - practical_experience
            - supplementary
        statement:
          type: string
          minLength: 1
        conditions:
          description: >-
            Required non-empty text for disagreement; null is allowed for the other
            viewpoint kinds.
          oneOf:
            - type: string
              minLength: 1
            - type: "null"
        sourceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
    LearningNodeAssessment:
      type: object
      additionalProperties: false
      required:
        - learningRelationshipId
        - questionSetId
        - versionId
        - nodeId
        - questions
      properties:
        learningRelationshipId:
          type: string
          minLength: 1
        questionSetId:
          type: string
          minLength: 1
          description: Immutable question-set version bound to the relationship.
        versionId:
          type: string
          minLength: 1
        nodeId:
          type: string
          minLength: 1
        questions:
          type: array
          minItems: 2
          maxItems: 3
          items:
            $ref: "#/components/schemas/AssessmentQuestionPrompt"
    AssessmentQuestionPrompt:
      type: object
      additionalProperties: false
      required:
        - questionId
        - nodeId
        - type
        - prompt
        - options
        - sourceIds
      properties:
        questionId:
          type: string
          minLength: 1
        nodeId:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - single_choice
            - multiple_choice
            - matching
            - opinion_analysis
        prompt:
          type: string
          minLength: 1
        options:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/AssessmentQuestionOption"
        sourceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
    AssessmentQuestionOption:
      type: object
      additionalProperties: false
      required:
        - optionId
        - label
      properties:
        optionId:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
    AssessmentSubmission:
      type: object
      additionalProperties: false
      required:
        - answers
      properties:
        answers:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AssessmentAnswer"
    AssessmentAnswer:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - questionId
            - selectedOptionIds
          properties:
            questionId:
              type: string
              minLength: 1
            selectedOptionIds:
              type: array
              uniqueItems: true
              items:
                type: string
                minLength: 1
        - type: object
          additionalProperties: false
          required:
            - questionId
            - matches
          properties:
            questionId:
              type: string
              minLength: 1
            matches:
              type: array
              items:
                $ref: "#/components/schemas/AssessmentMatchingAnswer"
    AssessmentMatchingAnswer:
      type: object
      additionalProperties: false
      required:
        - leftOptionId
        - rightOptionId
      properties:
        leftOptionId:
          type: string
          minLength: 1
        rightOptionId:
          type: string
          minLength: 1
    AssessmentSubmissionResult:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - learningRelationshipId
        - questionSetId
        - versionId
        - nodeId
        - nodeScore
        - bestScore
        - completed
        - submittedAt
        - questions
      properties:
        attemptId:
          type: string
          minLength: 1
        learningRelationshipId:
          type: string
          minLength: 1
        questionSetId:
          type: string
          minLength: 1
        versionId:
          type: string
          minLength: 1
        nodeId:
          type: string
          minLength: 1
        nodeScore:
          type: integer
          minimum: 0
          maximum: 10000
          description: Node score in integer basis points.
        bestScore:
          type: integer
          minimum: 0
          maximum: 10000
        completed:
          type: boolean
        submittedAt:
          type: string
          format: date-time
        questions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AssessmentQuestionResult"
    AssessmentQuestionResult:
      type: object
      additionalProperties: false
      required:
        - questionId
        - correct
        - scoreBasisPoints
        - explanation
        - sourceIds
      properties:
        questionId:
          type: string
          minLength: 1
        correct:
          type: boolean
        scoreBasisPoints:
          type: integer
          minimum: 0
          maximum: 10000
        explanation:
          type: string
          minLength: 1
        sourceIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
    LearningProgressSummary:
      type: object
      additionalProperties: false
      required:
        - learningRelationshipId
        - versionId
        - questionSetId
        - nodes
        - attempts
      properties:
        learningRelationshipId:
          type: string
          minLength: 1
        versionId:
          type: string
          minLength: 1
        questionSetId:
          type: string
          minLength: 1
        nodes:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LearningNodeProgress"
        attempts:
          type: array
          items:
            $ref: "#/components/schemas/LearningAttemptSummary"
    LearningNodeProgress:
      type: object
      additionalProperties: false
      required:
        - nodeId
        - bestScore
        - completed
        - completedAt
        - bestAttemptId
      properties:
        nodeId:
          type: string
          minLength: 1
        bestScore:
          type: integer
          minimum: 0
          maximum: 10000
        completed:
          type: boolean
        completedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        bestAttemptId:
          oneOf:
            - type: string
              minLength: 1
            - type: "null"
    LearningAttemptSummary:
      type: object
      additionalProperties: false
      required:
        - attemptId
        - nodeId
        - nodeScore
        - submittedAt
      properties:
        attemptId:
          type: string
          minLength: 1
        nodeId:
          type: string
          minLength: 1
        nodeScore:
          type: integer
          minimum: 0
          maximum: 10000
        submittedAt:
          type: string
          format: date-time
    MapGenerationRequest:
      type: object
      additionalProperties: false
      required:
        - topic
      properties:
        topic:
          type: string
          minLength: 1
          maxLength: 200
          description: 用户想系统学习的主题；服务端会再次规范化并建立缓存身份。
    MapGenerationRequestResult:
      type: object
      additionalProperties: false
      required:
        - reuse
        - snapshot
      properties:
        reuse:
          type: string
          enum:
            - created
            - active_task
            - cache
        snapshot:
          $ref: "#/components/schemas/GenerationTaskSnapshot"
    GenerationTaskSnapshot:
      type: object
      additionalProperties: false
      required:
        - taskId
        - status
        - stage
        - sequence
        - createdAt
        - updatedAt
        - deadlineAt
        - completedAt
        - result
        - failure
      properties:
        taskId:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - queued
            - normalizing
            - cache_lookup
            - planning
            - searching
            - structuring
            - supplementing
            - extracting
            - assessing
            - validating
            - publishing
            - succeeded
            - failed
        stage:
          type: string
          enum:
            - queued
            - normalizing
            - cache_lookup
            - planning
            - searching
            - structuring
            - supplementing
            - extracting
            - assessing
            - validating
            - publishing
        sequence:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        completedAt:
          description: Null before termination; terminal completion time otherwise.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        result:
          oneOf:
            - $ref: "#/components/schemas/GenerationResult"
            - type: "null"
        failure:
          oneOf:
            - $ref: "#/components/schemas/GenerationFailure"
            - type: "null"
    GenerationResult:
      type: object
      additionalProperties: false
      required:
        - mapId
        - versionId
        - learningRelationshipId
      properties:
        mapId:
          type: string
          minLength: 1
        versionId:
          type: string
          minLength: 1
        learningRelationshipId:
          type: string
          minLength: 1
    GenerationFailure:
      type: object
      additionalProperties: false
      required:
        - code
        - retryable
      properties:
        code:
          type: string
          enum:
            - invalid_topic
            - source_unavailable
            - source_insufficient
            - model_unavailable
            - candidate_invalid
            - generation_timeout
            - internal_failure
        retryable:
          type: boolean
    GenerationSseEventEnvelope:
      type: object
      additionalProperties: false
      required:
        - protocolVersion
        - taskId
        - sequence
        - type
        - occurredAt
        - data
      properties:
        protocolVersion:
          type: string
          const: "1"
        taskId:
          type: string
          minLength: 1
        sequence:
          type: integer
          minimum: 0
        type:
          type: string
          enum:
            - snapshot
            - progress
            - succeeded
            - failed
        occurredAt:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/GenerationSseEventData"
    GenerationSseEventData:
      type: object
      additionalProperties: false
      description: >-
        Safe state projection only. Candidate nodes, question bodies, source URLs,
        provider response bodies and participant identities are not representable.
      properties:
        taskId:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - queued
            - normalizing
            - cache_lookup
            - planning
            - searching
            - structuring
            - supplementing
            - extracting
            - assessing
            - validating
            - publishing
            - succeeded
            - failed
        stage:
          type: string
          enum:
            - queued
            - normalizing
            - cache_lookup
            - planning
            - searching
            - structuring
            - supplementing
            - extracting
            - assessing
            - validating
            - publishing
        sequence:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time
        result:
          oneOf:
            - $ref: "#/components/schemas/GenerationResult"
            - type: "null"
        failure:
          oneOf:
            - $ref: "#/components/schemas/GenerationFailure"
            - type: "null"
    GenerationSseStream:
      type: string
      description: >-
        text/event-stream records. Each record is `id: <sequence>`, `event:
        <snapshot|progress|succeeded|failed>`, and a JSON `data` value matching
        GenerationSseEventEnvelope. A `: keep-alive` comment is sent at most every
        15 seconds while a non-terminal task is waiting.
    ApiError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorBody"
    ApiErrorBody:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          pattern: "^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$"
          examples:
            - invalid_request
        message:
          type: string
          minLength: 1
          examples:
            - 请求内容不符合接口要求
        requestId:
          type: string
          minLength: 1
          examples:
            - req_01JXEXAMPLE
        issues:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ApiValidationIssue"
    ApiValidationIssue:
      type: object
      additionalProperties: false
      required:
        - path
        - code
        - message
      properties:
        path:
          type: string
          pattern: "^/(?:[^~/]|~0|~1)*(?:/(?:[^~/]|~0|~1)*)*$"
          examples:
            - /topic
        code:
          type: string
          pattern: "^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$"
          examples:
            - required
        message:
          type: string
          minLength: 1
          examples:
            - 请输入学习主题
    AuthenticationRequiredError:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  const: authentication_required
    ResourceNotFoundError:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  const: resource_not_found
    InternalServerError:
      allOf:
        - $ref: "#/components/schemas/ApiError"
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  const: internal_error
  responses:
    BadRequest:
      description: 请求结构、参数或输入无法解析
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    AuthenticationRequired:
      description: 未建立有效正式账户会话
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthenticationRequiredError"
    PermissionDenied:
      description: 当前身份无权执行该操作
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ResourceNotFound:
      description: 资源不存在或其存在性不可向当前身份暴露
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResourceNotFoundError"
    StateConflict:
      description: 请求与资源当前状态、版本或幂等约束冲突
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    RateLimited:
      description: 当前正式账户超过允许频率
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
        Retry-After:
          description: 再次请求前需要等待的秒数或 HTTP 日期
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: 未预期的内部错误
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalServerError"
